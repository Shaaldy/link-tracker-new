services:
  postgres:
    image: postgres:16
    container_name: linktracker-postgres
    environment:
      POSTGRES_DB: linktracker
      POSTGRES_USER: linktracker
      POSTGRES_PASSWORD: linktracker
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linktracker -d linktracker"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data: