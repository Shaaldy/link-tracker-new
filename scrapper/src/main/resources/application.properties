spring.application.name=scrapper
server.port=8081

# Секреты внешних API (только из переменных окружения).
# Приложение должно стартовать даже без них — API работают анонимно с низкими лимитами.
app.github.base-url=https://api.github.com
app.github.token=${GITHUB_TOKEN:}

app.stackoverflow.base-url=https://api.stackexchange.com/2.3
app.stackoverflow.key=${STACKOVERFLOW_KEY:}


app.bot-base-url=http://localhost:8080

# Логирование
logging.file.name=logs/scrapper.log
logging.level.by.shaaldy=DEBUG
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB
logging.logback.rollingpolicy.clean-history-on-start=true