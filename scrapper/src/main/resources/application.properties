spring.application.name=scrapper
server.port=8081

# Секреты внешних API (только из переменных окружения).
# Приложение должно стартовать даже без них — API работают анонимно с низкими лимитами.
app.github.base-url=https://api.github.com
app.github.token=${GITHUB_TOKEN:}

app.stackoverflow.base-url=https://api.stackexchange.com/2.3
app.stackoverflow.key=${STACKOVERFLOW_KEY:}


app.bot-base-url=http://localhost:8080
app.scheduler-interval=30s

# Логирование
logging.file.name=logs/scrapper.log
logging.level.by.shaaldy=DEBUG
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB
logging.logback.rollingpolicy.clean-history-on-start=true



# --- Datasource ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/linktracker}
spring.datasource.username=${DB_USERNAME:linktracker}
spring.datasource.password=${DB_PASSWORD:linktracker}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.liquibase.enabled=false

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- Выбор провайдера доступа к БД (требование ДЗ: access-type=SQL|ORM) ---
app.access-type=SQL

# --- Планировщик: размер батча и интервал (в конфиг, по требованию ДЗ) ---
app.scheduler.batch-size=100
app.scheduler.interval=PT1M
app.scheduler.parallelism=10


app.migrations.changelog=migrations/master.xml